name: Build Linux DEB

# Main releases remain manual; validation builds do not publish a release.
# Upstream synchronization on main does not trigger a build.
on:
  push:
    branches: [linux-validation, linux-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Source version X.Y.Z; empty uses nearest upstream-style vX.Y.Z git tag'
        required: false
        default: ''
        type: string
      publish:
        description: 'Publish a Linux Release after every installation check passes'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: linux-deb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build one Ubuntu 22.04 baseline .deb
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
      package_version: ${{ steps.version.outputs.package_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    env:
      PYMSS_BUILD_GIT_COMMIT: ${{ github.sha }}
      PYMSS_BUILD_GIT_REF: ${{ github.ref_name }}
      PYMSS_BUILD_RUN_ID: ${{ github.run_id }}
      PYMSS_BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
      PYMSS_BUILD_REPOSITORY: ${{ github.repository }}
      PYMSS_BUILD_REPOSITORY_OWNER: ${{ github.repository_owner }}
      PYMSS_BUILD_TARGET: linux-amd64
      PYMSS_BUILD_VARIANT: linux-amd64-online
      PYMSS_BUILD_UPDATE_SUPPORTED: 'false'
      PYMSS_BUILD_OFFICIAL: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve package version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [[ -z "$version" ]]; then
            version="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || true)"
          fi
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Specify a version X.Y.Z, or ensure upstream release tags were fetched."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package_version=$version-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$version-linux.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "PYMSS_BUILD_PACKAGE_VERSION=$version-$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "PYMSS_BUILD_GIT_TAG=v$version-linux.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "PYMSS_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "Building $version from commit $GITHUB_SHA"

      - name: Install Tauri 2 build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev build-essential \
            curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            patchelf dpkg-dev pkg-config

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare bundled bootstrap Python and Tauri config
        run: |
          node --check scripts/linux-media-compat.js
          node scripts/test-linux-media-compat.mjs
          python3 scripts/test-linux-optional-packages.py
          python3 scripts/test-linux-release-compat.py
          bash scripts/prepare-linux-bundle.sh "${{ steps.version.outputs.version }}"

      - name: Verify Linux CPU and CUDA manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("src-tauri/resources/python/runtime-manifest.json").read_text(encoding="utf-8"))
          for backend in ("cpu", "cuda"):
              spec = manifest["backends"][backend]
              assert "linux" in spec["platforms"], f"{backend} is not supported on Linux"
              assert spec["torch"]["requirement"] == "torch==2.7.1", backend
          assert manifest["backends"]["cuda"]["torch"]["indexUrl"].endswith("/cu128")
          print("Runtime manifest declares Linux CPU and NVIDIA CUDA 12.8 installation support.")
          PY

      - name: Build DEB
        run: pnpm tauri build --bundles deb --config src-tauri/tauri.linux-ci.json

      - name: Inspect and checksum package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          bash -n scripts/prepare-linux-bundle.sh scripts/finalize-linux-deb.sh scripts/install-linux-deb.sh scripts/setup-linux-runtime.sh
          install -m 0644 scripts/install-linux-deb.sh scripts/setup-linux-runtime.sh package/
          install -m 0644 src-tauri/resources/linux-build-info.json package/BUILD-INFO.json
          input_deb="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -type f)"
          test -f "$input_deb"
          bash scripts/finalize-linux-deb.sh "$input_deb" package "${{ steps.version.outputs.version }}" "$GITHUB_RUN_NUMBER"
          test "$(find package -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          dpkg-deb --info package/*.deb
          dpkg-deb --contents package/*.deb | grep -E 'python-runtime/bin/python3|python/worker.py'
          (cd package && sha256sum *.deb install-linux-deb.sh setup-linux-runtime.sh BUILD-INFO.json > SHA256SUMS)
          ls -lh package/

      - uses: actions/upload-artifact@v4
        with:
          name: pymss-studio-linux-amd64
          path: package/
          retention-days: 30
          if-no-files-found: error

  install-smoke:
    name: Install smoke / ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pymss-studio-linux-amd64
          path: package

      - name: Verify checksum and install with APT
        shell: bash
        run: |
          set -euo pipefail
          (cd package && sha256sum --check SHA256SUMS)
          sudo apt-get update
          sudo apt-get install -y ./package/*.deb

      - name: Check installed Python, worker and native libraries
        shell: bash
        run: |
          set -euo pipefail
          dpkg-query --show --showformat='${Package} ${Version}\n' pymss-studio
          dpkg -L pymss-studio | grep -E '/python/worker.py$'
          py="$(dpkg -L pymss-studio | grep -E '/python-runtime/bin/python3$' | head -n1)"
          test -n "$py" && test -x "$py"
          PYTHONDONTWRITEBYTECODE=1 "$py" -c 'import sys, requests, socks; assert sys.version_info[:2] == (3, 12); print(sys.version)'
          cmp package/BUILD-INFO.json "$(dirname "$(dirname "$py")")/../linux-build-info.json"
          python3 - <<'PY'
          import json, subprocess
          info = json.load(open("package/BUILD-INFO.json"))
          version = subprocess.check_output(["dpkg-query", "--show", "--showformat=${Version}", "pymss-studio"], text=True)
          assert info["packageVersion"] == version
          assert info["repository"] == "${{ github.repository }}"
          assert info["gitCommit"] == "${{ github.sha }}"
          assert info["runId"] == "${{ github.run_id }}"
          assert info["official"] is False and info["updateSupported"] is False
          print("Installed package provenance:", info)
          PY
          command -v ffmpeg
          command -v ffprobe
          command -v aria2c
          app="$(dpkg -L pymss-studio | grep -E '^/usr/bin/[^/]+$' | head -n1)"
          test -n "$app" && test -x "$app"
          if ldd "$app" | tee /tmp/pymss-ldd.txt | grep -q 'not found'; then
            cat /tmp/pymss-ldd.txt
            exit 1
          fi
          echo "APT and native-link smoke checks passed: $(lsb_release -ds)"

  publish:
    name: Publish verified Linux Release
    needs: [build, install-smoke]
    if: github.repository == 'ChrisTorng/pymss-studio-linux' && (github.ref == 'refs/heads/linux-release' || inputs.publish == true)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pymss-studio-linux-amd64
          path: package
      - name: Verify release assets
        run: cd package && sha256sum --check SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Pymss Studio Linux ${{ needs.build.outputs.package_version }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: false
          body: |
            Linux fork package **${{ needs.build.outputs.package_version }}**, based on upstream Pymss Studio **${{ needs.build.outputs.version }}**.

            This is a third-party Linux build from ChrisTorng/pymss-studio-linux, not an upstream official release. Linux application updates use manual DEB installation.

            ### Changes
            - About now shows the Linux package revision and real CI build fingerprint, repository, commit and run.
            - The download button opens this fork's Releases; upstream project and license links remain attributed to upstream.
            - Includes the existing FunASR venv, WebKitGTK onboarding and audio-preview compatibility fixes.

            ### Installation
            Download the DEB and install-linux-deb.sh into the same directory, then run:
            ```bash
            bash ./install-linux-deb.sh ./pymss-studio_${{ needs.build.outputs.package_version }}_amd64.deb
            ```
            On a first installation, configure the NVIDIA runtime with `bash ./setup-linux-runtime.sh cuda` (or `cpu`). An existing configured runtime is retained when upgrading the DEB.

            ### Verification and scope
            Built on Ubuntu 22.04; package installation, bundled Python, native-library and provenance checks passed on Ubuntu 22.04, 24.04 and 26.04. These CI runners do not verify GPU inference or every application feature. Previous real RTX 4090 / CUDA 12.8 separation and FunASR validation is recorded in LINUX.md.

            Source: ${{ github.sha }}
            Build: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            BUILD-INFO.json records provenance; SHA256SUMS covers the DEB, scripts and metadata. See https://github.com/${{ github.repository }}/blob/${{ github.sha }}/LINUX.md for requirements and known limits.
          files: |
            package/*.deb
            package/install-linux-deb.sh
            package/setup-linux-runtime.sh
            package/BUILD-INFO.json
            package/SHA256SUMS
